services:
  - type: web
    name: scorpions-ai-api
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: demo
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
